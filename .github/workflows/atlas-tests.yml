name: Game Arts tests
# Every change runs the whole suite: the guards cover documents, skills and instructions as well as scripts and schemas.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
        pillow: ["latest"]
        include:
          - os: ubuntu-latest
            python: "3.11"
            pillow: "9.5.0"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Pillow ${{ matrix.pillow }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip jsonschema
          if [ "${{ matrix.pillow }}" = "latest" ]; then python -m pip install --upgrade Pillow; else python -m pip install "Pillow==${{ matrix.pillow }}"; fi
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
